<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 240 214" width="240" height="214" role="img" aria-label="Sobaya">
  <defs>
    <linearGradient id="strand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="0.45" stop-color="#e5484d"/>
      <stop offset="0.6" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <!-- bowl -->
  <path d="M38 132 Q120 250 202 132 Z" fill="#2b2d42"/>
  <ellipse cx="120" cy="132" rx="84" ry="16" fill="#3d405f"/>
  <ellipse cx="120" cy="132" rx="84" ry="16" fill="none" stroke="#f3ede2" stroke-width="5"/>
  <!-- foot -->
  <rect x="92" y="186" width="56" height="10" rx="5" fill="#2b2d42"/>

  <!-- noodles resting in the bowl -->
  <path d="M60 134 q20 10 40 0 q20 -10 40 0 q20 10 40 0" fill="none" stroke="#f3ede2" stroke-width="7" stroke-linecap="round"/>

  <!-- chopsticks -->
  <g stroke="#c98a3a" stroke-width="7" stroke-linecap="round">
    <line x1="176" y1="22" x2="132" y2="122"/>
    <line x1="196" y1="30" x2="146" y2="124"/>
  </g>

  <!-- one strand lifted from the bowl: red where it starts, green where it ends -->
  <path d="M74 118 L108 156 L184 60" fill="none" stroke="url(#strand)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="74" cy="118" r="10" fill="#e5484d"/>
  <circle cx="184" cy="60" r="10" fill="#3fb950"/>
</svg>
