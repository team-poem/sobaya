<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 240 224" width="240" height="224" role="img" aria-label="Sobaya">
  <!-- bowl -->
  <path d="M38 122 Q120 240 202 122 Z" fill="#2b2d42"/>
  <ellipse cx="120" cy="122" rx="84" ry="16" fill="#3d405f"/>
  <ellipse cx="120" cy="122" rx="84" ry="16" fill="none" stroke="#f3ede2" stroke-width="5"/>
  <rect x="92" y="176" width="56" height="10" rx="5" fill="#2b2d42"/>

  <!-- noodles resting in the bowl -->
  <path d="M60 124 q20 10 40 0 q20 -10 40 0 q20 10 40 0" fill="none" stroke="#f3ede2" stroke-width="7" stroke-linecap="round"/>

  <!-- one strand climbs out of the bowl and coils around the chopsticks -->
  <g fill="none" stroke="#f3ede2" stroke-width="7" stroke-linecap="round">
    <path d="M104 127 C 112 112, 118 106, 122.0 106.0"/>
    <path d="M124.0 101.98 A15 5 0 0 1 154.0 101.98" transform="rotate(-22.6 139.0 101.98)"/>
<path d="M129.6 89.89 A15 5 0 0 1 159.6 89.89" transform="rotate(-22.6 144.6 89.89)"/>
<path d="M135.2 77.8 A15 5 0 0 1 165.2 77.8" transform="rotate(-22.6 150.2 77.8)"/>
  </g>
  <g stroke="#c98a3a" stroke-width="7" stroke-linecap="round">
    <line x1="166" y1="18" x2="126" y2="114"/>
    <line x1="186" y1="26" x2="140" y2="116"/>
  </g>
  <g fill="none" stroke="#f3ede2" stroke-width="7" stroke-linecap="round">
    <path d="M154.0 101.98 A15 5 0 0 1 124.0 101.98" transform="rotate(-22.6 139.0 101.98)"/>
<path d="M159.6 89.89 A15 5 0 0 1 129.6 89.89" transform="rotate(-22.6 144.6 89.89)"/>
<path d="M165.2 77.8 A15 5 0 0 1 135.2 77.8" transform="rotate(-22.6 150.2 77.8)"/>
    <path d="M165.2 77.8 C 175.2 71.8, 176 62, 170 48"/>
  </g>

  <!-- two plates under the bowl: red, then green -->
  <g>
    <ellipse cx="74" cy="212" rx="40" ry="11" fill="#e5484d"/>
    <ellipse cx="74" cy="208" rx="40" ry="11" fill="#f26b6f"/>
    <ellipse cx="74" cy="208" rx="22" ry="5" fill="#e5484d"/>
  </g>
  <g>
    <ellipse cx="166" cy="212" rx="40" ry="11" fill="#2ea043"/>
    <ellipse cx="166" cy="208" rx="40" ry="11" fill="#3fb950"/>
    <ellipse cx="166" cy="208" rx="22" ry="5" fill="#2ea043"/>
  </g>
</svg>
