name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Check out hosted verification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go for fixture checks
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.23.x"
          cache: false
      - name: Check harness prerequisites
        run: |
          bash --version
          git --version
          jq --version
          node --version
          go version
      - name: Run the complete shell harness suite
        run: bash tests/run.sh
      - name: Check the generated brain index
        run: bash scripts/brain-index.sh . --check
      - name: Check workspace boundaries
        run: bash scripts/workspace-check.sh .
